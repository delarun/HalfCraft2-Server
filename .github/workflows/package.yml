name: Package

on:
  workflow_call:
    inputs:
      version:
        description: halfcraft's version (tools/build/version.py)
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows zip
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      HALFCRAFT_VERSION: ${{ inputs.version }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: JDK 25
        run: python .github/scripts/pinned.py jdk
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: SDK trees
        run: python tools/build/setup_sdk.py
      - name: Minecraft mod
        run: python tools/build/gradle.py assemble
      - name: Half-Life side
        run: python tools/build/build_hl2.py
      - name: Zip
        run: python tools/build/package.py --no-build
      - name: Server's Windows client (the game folder the launcher installs on Windows)
        run: python tools/server/network.py client-zip --out dist/HalfCraft-client-windows-${{ inputs.version }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halfcraft-${{ inputs.version }}
          path: dist/HalfCraft-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: clang-tidy 22.1.8
        run: python .github/scripts/pinned.py clang-tidy
      - name: make tidy
        run: python tools/lint/tidy.py

  launcher:
    name: Launcher (Linux and Windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: launcher/go.sum
      - name: webkit2gtk and mingw-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: make launcher
        run: make launcher
      - name: Name them by the version
        run: |
          mv dist/halfcraft-launcher dist/halfcraft-launcher-${{ inputs.version }}-linux-x64
          mv dist/HalfCraft.exe dist/HalfCraft-launcher-${{ inputs.version }}-windows-x64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halfcraft-launcher-${{ inputs.version }}
          path: dist/*launcher*
          if-no-files-found: error
          retention-days: 30
